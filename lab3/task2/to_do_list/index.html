<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>To-Do List</h1>
      <p class="hint">Enter = add • Checkbox = done • Delete = remove</p>
    </div>

    <div class="controls">
      <input id="todoInput" type="text" placeholder="Add a new task..." />
      <button id="addBtn">Add</button>
    </div>

    <ul id="todoList"></ul>
    <div id="emptyState" class="empty">No tasks yet. Add one above.</div>

    <div class="footer">
      <div class="count">Tasks: <strong id="taskCount">0</strong></div>
      <div>DOM: createElement / appendChild / removeChild</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
